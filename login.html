<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso administrador - Eurovision Spain</title>
<link href="assets/bootstrap/bootstrap.min.css" rel="stylesheet">
<style>
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f4f4f4;
}

.brand-icon span { display: block; width: 22px; height: 3px; background: #2B407C; }
</style>
</head>
<body>

<main class="card shadow-sm" style="width:100%; max-width:400px;">
  <div class="card-body p-4 p-md-5">

    <div class="text-center mb-3" aria-hidden="true">
      <div class="brand-icon d-inline-flex flex-column gap-1 align-items-start mb-2">
        <span></span><span></span><span></span>
      </div>
      <div class="fw-bolder text-uppercase lh-1 fs-5" style="color:#2B407C;">Eurovision<br>Spain</div>
    </div>

    <h1 class="h4 fw-bold text-center">Acceso al administrador</h1>
    <p class="text-center text-body-secondary small mb-4">Introduce tus credenciales para gestionar la portada.</p>

    <form id="login-form" novalidate>
      <div class="alert alert-danger py-2 small fw-semibold" id="login-error" hidden></div>

      <div class="mb-3">
        <label for="l-email" class="form-label text-uppercase small fw-semibold">Email</label>
        <input type="email" class="form-control" id="l-email" placeholder="admin@curso.com" autocomplete="username" autofocus>
      </div>

      <div class="mb-4">
        <label for="l-clave" class="form-label text-uppercase small fw-semibold">Contraseña</label>
        <input type="password" class="form-control" id="l-clave" autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-semibold">Entrar</button>
    </form>

    <a href="index.html" class="d-block text-center small text-body-secondary mt-4">&larr; Volver a la portada sin iniciar sesión</a>
  </div>
</main>

<script src="assets/bootstrap/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>

</body>
</html>
