<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar noticia destacada - Eurovision Spain</title>
<style>
:root {
  --azul-principal: #0033A0;
  --azul-logo: #2B407C;
  --rosa: #D11D5D;
  --gris-placeholder: #d8d8d8;
  --blanco: #FFFFFF;
  --texto: #1a1a1a;
  --texto-suave: #6b6b6b;
  --borde: #cccccc;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--gris-placeholder);
  color: var(--texto);
  font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

a { text-decoration: none; color: inherit; transition: color .2s ease; }

.topbar {
  background: var(--blanco);
  border-bottom: 1px solid #e5e5e5;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1200px;
  margin: 0 auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-icon { display: flex; flex-direction: column; gap: 4px; }
.brand-icon span { display: block; width: 22px; height: 3px; background: var(--azul-logo); }

.brand-text {
  text-transform: uppercase;
  font-weight: 800;
  font-size: 1.15rem;
  line-height: 1.1;
  letter-spacing: .02em;
  color: var(--azul-logo);
}

.back-link {
  color: var(--azul-principal);
  font-weight: 700;
  font-size: .85rem;
}

.back-link:hover { text-decoration: underline; }

.panel {
  max-width: 720px;
  margin: 32px auto;
  padding: 32px;
  background: var(--blanco);
  border-radius: 10px;
  box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
}

.panel h1 { margin: 0 0 4px; font-size: 1.5rem; font-weight: 800; }
.panel > p { margin: 0 0 24px; color: var(--texto-suave); font-size: .9rem; }

.modo-datos {
  display: inline-block;
  margin-bottom: 20px;
  padding: 6px 12px;
  border-radius: 999px;
  background: #eef2fb;
  border: 1px solid var(--azul-principal);
  color: var(--azul-principal);
  font-size: .75rem;
  font-weight: 700;
}

.field { margin-bottom: 18px; }

.field label {
  display: block;
  margin-bottom: 6px;
  font-size: .75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--texto);
}

.field input,
.field textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--borde);
  border-radius: 6px;
  font: inherit;
  color: var(--texto);
  background: #fff;
}

.field input:focus,
.field textarea:focus {
  outline: none;
  border-color: var(--azul-principal);
  box-shadow: 0 0 0 2px rgba(0, 51, 160, .15);
}

.field textarea { resize: vertical; min-height: 96px; }

.date-row {
  display: grid;
  grid-template-columns: 80px 110px 110px;
  gap: 12px;
}

.hint { margin: 4px 0 0; font-size: .75rem; color: var(--texto-suave); }

.preview {
  position: relative;
  aspect-ratio: 16 / 9;
  background: var(--gris-placeholder);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 6px;
}

.preview img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.media-label { color: #888888; font-size: .9rem; text-align: center; padding: 0 24px; }

.actions {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 26px;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 22px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font: inherit;
  font-weight: 700;
  font-size: .9rem;
}

.btn-primary {
  background: var(--azul-principal);
  color: #fff;
}

.btn-primary:hover { background: #00217a; }

.btn-secondary {
  background: transparent;
  color: var(--texto-suave);
  border: 1px solid var(--borde);
}

.btn-secondary:hover { color: var(--rosa); border-color: var(--rosa); }

.error-msg {
  width: 100%;
  margin: 0 0 8px;
  padding: 10px 12px;
  border-radius: 6px;
  background: #fdecef;
  border: 1px solid var(--rosa);
  color: var(--rosa);
  font-size: .85rem;
  font-weight: 600;
}

@media (max-width: 560px) {
  .panel { margin: 16px; padding: 20px; }
  .date-row { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
}
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="brand" aria-label="Volver a la portada de Eurovision Spain">
    <span class="brand-icon" aria-hidden="true"><span></span><span></span><span></span></span>
    <span class="brand-text">Eurovision<br>Spain</span>
  </a>
  <a href="index.html" class="back-link">&larr; Volver a la portada</a>
</header>

<main class="panel">
  <h1>Editar noticia destacada</h1>
  <p>Los cambios se reflejarán en la portada al guardar.</p>
  <span class="modo-datos" id="modo-datos">Detectando modo de datos…</span>

  <form id="edit-form" novalidate>
    <p class="error-msg" id="form-error" hidden></p>

    <div class="field">
      <label for="f-categoria">Categoría (subtítulo)</label>
      <input type="text" id="f-categoria" autocomplete="off">
    </div>

    <div class="field">
      <label for="f-titulo">Título *</label>
      <textarea id="f-titulo" rows="3" required></textarea>
    </div>

    <div class="field">
      <label>Fecha</label>
      <div class="date-row">
        <input type="text" id="f-dia" inputmode="numeric" maxlength="2" placeholder="Día" aria-label="Día">
        <input type="text" id="f-mes" maxlength="3" placeholder="Mes" aria-label="Mes" style="text-transform:uppercase">
        <input type="text" id="f-anio" inputmode="numeric" maxlength="4" placeholder="Año" aria-label="Año">
      </div>
      <p class="hint">Formato del mes: tres letras en mayúsculas (ej. AGO).</p>
    </div>

    <div class="field">
      <label for="f-url">URL de la imagen</label>
      <input type="text" id="f-url" inputmode="url" placeholder="https://ejemplo.com/foto.jpg" autocomplete="off">
    </div>

    <div class="field">
      <label>Vista previa</label>
      <div class="preview" id="preview" aria-live="polite"></div>
      <p class="hint">Si la URL falla o está vacía se mostrará el texto del placeholder.</p>
    </div>

    <div class="field">
      <label for="f-placeholder">Texto del placeholder</label>
      <input type="text" id="f-placeholder" autocomplete="off">
    </div>

    <div class="actions">
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
      <button type="button" class="btn btn-secondary" id="btn-restaurar">Restaurar valores originales</button>
      <a href="index.html" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>

</body>
</html>
